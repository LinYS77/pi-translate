name: GitHub Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (npm publication may follow)
        required: true
        default: v0.2.0

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the release tag and npm identity
        id: published
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { appendFileSync, existsSync, readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const tag = process.env.INPUT_TAG || (process.env.GITHUB_REF.startsWith("refs/tags/")
            ? process.env.GITHUB_REF.slice("refs/tags/".length) : `v${manifest.version}`);
          assert.match(tag, /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          const version = tag.slice(1);
          const commit = execFileSync("git", ["rev-parse", `${tag}^{commit}`], { encoding: "utf8" }).trim();
          const taggedManifest = JSON.parse(execFileSync("git", ["show", `${tag}:package.json`], { encoding: "utf8" }));
          assert.equal(taggedManifest.name, manifest.name);
          assert.equal(taggedManifest.version, version, "Tag and package version must agree");
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(manifest.name)}/${version}`, {
            signal: AbortSignal.timeout(30_000),
          });
          if (response.ok) {
            const published = await response.json();
            assert.equal(published.name, manifest.name);
            assert.equal(published.version, version);
            assert.equal(commit, published.gitHead, "Tag must match the existing npm release");
          } else {
            assert.equal(response.status, 404, `Unexpected npm registry error: HTTP ${response.status}`);
            console.log("npm version not yet published; the maintainer will publish this tagged commit separately.");
          }
          const notes = `docs/releases/${tag}.md`;
          assert.ok(existsSync(notes), `Missing release notes: ${notes}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nnotes=${notes}\nprerelease=${version.includes("-")}\n`);
          console.log(`Verified ${manifest.name}@${version}: ${tag} -> ${commit}`);
          JS
      - run: npm ci --ignore-scripts
      - run: npm run verify
        env:
          PI_OFFLINE: "1"
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.published.outputs.tag }}
          NOTES: ${{ steps.published.outputs.notes }}
          PRERELEASE: ${{ steps.published.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES" "${flags[@]}"
